<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="theme">
        <button id="themeBtn" onclick="toggleTheme()">
            🌙
        </button>
    </div>
    <h1>💰 Expense Tracker Pro</h1>
    <div class="dashboard">
        <div class="card balance-card">
            <h3>💰 Total Balance</h3>
            <h2 id="balance">₹0.00</h2>
        </div>
        <div class="income-expense">
            <div class="card income-card">
                <h4>💵 Income</h4>
                <p id="income">₹0.00</p>
            </div>
            <div class="card expense-card">
                <h4>💸 Expense</h4>
                <p id="expense">₹0.00</p>
            </div>
        </div>
    </div>
    <h2>Add New Transaction</h2>
    <form>
        <label>Description</label>
        <input
            type="text"
            id="description"
            placeholder="Enter Description">
        <label>Amount</label>
        <input
            type="number"
            id="amount"
            placeholder="Enter Amount">
        <label>Category</label>
        <select id="category">
            <option value="Salary">Salary</option>
            <option value="Food">Food</option>
            <option value="Shopping">Shopping</option>
            <option value="Travel">Travel</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="water">water</option>
            <option value="oil">oil</option>
            <option value="vegtables">vegtables</option>
            <option value="spices">spices</option>
        </select>
        <label>Date</label>
        <input
            type="date"
            id="date">
        <label>Payment Method</label>

<select id="payment">

    <option value="Cash">💵 Cash</option>
    <option value="UPI">📱 UPI</option>
    <option value="Debit Card">💳 Debit Card</option>
    <option value="Credit Card">💳 Credit Card</option>
    <option value="Net Banking">🏦 Net Banking</option>
    <option value="Cheque">📄 Cheque</option>

</select>
<label>Upload Receipt</label>

<input
    type="file"
    id="receipt"
    accept="image/*">
        <p>
            Use a positive number for Income and a negative number for Expense.
        </p>
       <button
    id="addBtn"
    type="button"
    onclick="addTransaction()">
    Add Transaction
</button>
    </form>
    <h2>Transaction History</h2>
    <input
        type="text"
        id="search"
        placeholder="🔍 Search Transaction..."
        onkeyup="searchTransaction()">
    <label style="margin-top:20px;">
        Filter by Category
    </label>
    <select
        id="filter"
        onchange="filterTransactions()">
        <option value="All">All</option>
         <option value="Food">Food</option>
        <option value="Salary">Salary</option>
        <option value="Shopping">Shopping</option>
        <option value="Travel">Travel</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
         <option value="water">water</option>
        <option value="oil">oil</option>
        <option value="vegtables">vegtables</option>
        <option value="spices">spices</option>
    </select>
    <ul id="history">
    </ul>
    <h2>Expense Analysis</h2>
    <canvas id="expenseChart"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/script.js"></script>
</body>
</html>
